<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ireland's Housing Divide</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f8;color:#172432;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:calc(100vw - 12px);margin:6px auto;padding:12px 12px;background:white;border:1px solid #e1e7ee;border-radius:10px;box-shadow:0 2px 12px #1d31420d}
h1{font-size:27px;letter-spacing:-.45px;line-height:1.15;margin:0}
.lead{border-left:4px solid #31708E;background:#f1f6fa;padding:10px 14px;margin:0 0 8px;font-size:15px;font-weight:650;line-height:1.35}
.intro{color:#52616e;line-height:1.42;margin:0 0 12px}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 8px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 10px;background:#f6f8fa;border:1px solid #e3e9ef;border-radius:7px;width:fit-content}
.toolbar .vega-bindings{display:flex;align-items:center;flex-wrap:wrap;gap:14px}
.toolbar .vega-bind{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}
.toolbar .vega-bind-name{min-width:0!important;margin-right:0!important;font-weight:700;color:#172432}
.toolbar select{max-width:270px;padding:5px 8px;border:1px solid #ccd7df;border-radius:5px;background:white;color:#172432;font:inherit}
#vis{position:relative;width:100%;overflow:visible;min-height:1px}
#vis .vega-embed{width:max-content;min-width:0;display:block;transform-origin:top left;position:absolute;top:0;left:0}
footer{font-size:11px;color:#687989;margin-top:4px}
@media(max-width:900px){main{width:100%;margin:0;border-radius:0;padding:14px}.toprow{align-items:stretch}.toolbar{width:100%}h1{font-size:23px}}
</style>
</head>
<body>
<main>
<header class="toprow">
  <h1>Ireland's Housing Divide</h1>
  <div id="controls" class="toolbar" aria-label="Dashboard controls"></div>
</header>
<div id="vis" aria-label="Interactive housing affordability dashboard"></div>
<footer>Source: CSO dwelling purchases and purchaser-income statistics, processed for this visualisation. These ratios describe purchasers rather than all households.</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/vega@5/build/vega.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5/build/vega-lite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6/build/vega-embed.min.js"></script>
<script>
fetch('./irelands_housing_divide.json').then(response=>{if(!response.ok)throw new Error('Could not fetch chart specification ('+response.status+')');return response.json()})
.then(async spec=>{
  delete spec.title; // The page header supplies the main title.
  await vegaEmbed('#vis', spec, {
    mode: 'vega-lite', renderer: 'svg', actions: false, bind: '#controls'
  });

  // Vega-Lite views have fixed canvas dimensions. Fit the complete result
  // (including the map legend) within the available browser viewport.
  // This preserves the relative chart dimensions and linked interactions.
  const stage = document.querySelector('#vis');
  const embed = stage.querySelector('.vega-embed');
  const svg = embed && embed.querySelector('svg');
  if (!svg) return;
  const nativeWidth = parseFloat(svg.getAttribute('width')) || svg.getBoundingClientRect().width;
  const nativeHeight = parseFloat(svg.getAttribute('height')) || svg.getBoundingClientRect().height;
  let pending = false;
  function fitDashboard() {
    pending = false;
    embed.style.transform = 'none';
    const page = document.querySelector('main');
    const footer = document.querySelector('footer');
    const pageRect = page.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const usableWidth = Math.max(320, stage.clientWidth - 4);
    const usableHeight = Math.max(250,
      window.innerHeight - stageRect.top - (footer ? footer.offsetHeight : 0)
      - 22 - parseFloat(getComputedStyle(page).paddingBottom || '0'));
    const scale = Math.min(1, usableWidth / nativeWidth, usableHeight / nativeHeight);
    embed.style.transformOrigin = 'top left';
    embed.style.transform = `scale(${scale})`;
    stage.style.height = `${Math.ceil(nativeHeight * scale) + 3}px`;
  }
  function scheduleFit() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(fitDashboard);
  }
  fitDashboard();
  window.addEventListener('resize', scheduleFit);
  // Fonts may load after the first drawing; re-fit once they're available.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);
})
.catch(err=>{document.querySelector('#vis').textContent='Unable to load dashboard: '+err.message;console.error(err)});
</script>
</body>
</html>
